# Builds an unsigned iPhone app (.ipa) of the calculator for personal sideloading (for example with Sideloadly,
# which signs it with your own Apple ID). Also launches it in an iPhone simulator and saves a screenshot.
name: iOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios-app/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # -eo pipefail, so a failing xcodebuild is not hidden by the `| tail` that trims its log
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the website into the app
        run: |
          mkdir -p www
          cp -R ../index.html ../assets ../vendor www/

      - name: Create the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Add the widget extension and bridge plugin
        run: |
          cp native/App/*.swift native/App/App.entitlements ios/App/App/
          mkdir -p ios/App/GPAWAMWidget && cp native/Widget/* ios/App/GPAWAMWidget/
          # the app's web view controller becomes MainViewController, which registers the WidgetBridge plugin
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          grep -c 'customClass="MainViewController"' ios/App/App/Base.lproj/Main.storyboard
          gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          ruby native/setup.rb

      - name: App name, icon and launch screen
        run: |
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'GPA & WAM'" "$plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'GPA & WAM'" "$plist"
          # replace every image in the icon and splash sets with ours, resized to each slot's size
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            sips -s format png -z "$w" "$w" resources/icon-1024.png --out "$f" >/dev/null
          done
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            sips -s format png -z "$w" "$w" resources/splash-2732.png --out "$f" >/dev/null
          done
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset ios/App/App/Assets.xcassets/Splash.imageset

      - name: Build for iPhone (unsigned)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then C="-workspace ios/App/App.xcworkspace"; else C="-project ios/App/App.xcodeproj"; fi
          xcodebuild $C -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # ad-hoc signatures carry the app group entitlement into the .ipa; Sideloadly re-signs with your Apple ID
          app=Payload/App.app
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements native/Widget/GPAWAMWidget.entitlements "$app/PlugIns/GPAWAMWidget.appex"
          codesign --force --sign - --entitlements native/App/App.entitlements "$app"
          codesign -d --entitlements - "$app/PlugIns/GPAWAMWidget.appex" 2>/dev/null | grep -c application-groups
          ls "$app/PlugIns"
          zip -qry GPA-WAM.ipa Payload
          ls -la GPA-WAM.ipa

      - name: Run in the iPhone simulator and take a screenshot
        continue-on-error: true
        run: |
          # simulator build only: a self-test opens Settings and prints what each native plugin reports
          cat >> ios/App/App/public/index.html <<'HTML'
          <script>
          window.addEventListener('load', () => setTimeout(async () => {
            location.hash = '#/settings';
            const C = window.Capacitor, P = n => C.Plugins[n] || C.registerPlugin(n), out = ['SELF-TEST'];
            const t = async (label, f) => { try { out.push(label + ': ' + JSON.stringify(await f())); } catch (e) { out.push(label + ' FAILED: ' + (e.message || e)); } };
            await t('native', () => C.isNativePlatform());
            await t('widget status', () => P('WidgetBridge').status());
            await t('notifications', () => P('LocalNotifications').checkPermissions());
            await t('pending', () => P('LocalNotifications').getPending().then(r => r.notifications.length));
            await t('filesystem', () => P('Filesystem').writeFile({ path: 'selftest.txt', data: 'aGk=', directory: 'CACHE' }).then(r => !!r.uri));
            await t('share', () => typeof P('Share').share);
            const d = document.createElement('pre');
            d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:#000;color:#3f3;font:13px monospace;padding:12px 12px 40px;white-space:pre-wrap;margin:0';
            d.textContent = out.join(String.fromCharCode(10));
            document.body.appendChild(d);
          }, 5000));
          </script>
          HTML
          if [ -d ios/App/App.xcworkspace ]; then C="-workspace ios/App/App.xcworkspace"; else C="-project ios/App/App.xcodeproj"; fi
          xcodebuild $C -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -n 5
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" simbuild/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$udid" com.kyosukeamagiri.gpawam
          sleep 28
          xcrun simctl io "$udid" screenshot simulator.png

      - uses: actions/upload-artifact@v4
        with:
          name: GPA-WAM-ipa
          path: ios-app/GPA-WAM.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: ios-app/simulator.png
          if-no-files-found: ignore
          retention-days: 7
